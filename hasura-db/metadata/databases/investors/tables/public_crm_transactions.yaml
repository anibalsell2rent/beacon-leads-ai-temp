table:
  name: crm_transactions
  schema: public
object_relationships:
  - name: investor
    using:
      foreign_key_constraint_on: investor_id
  - name: property
    using:
      foreign_key_constraint_on: property_id
event_triggers:
  - name: on_crm_transactions_change
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: https://beacon-leads-ai-backend-663034886613.us-central1.run.app/api/webhooks/crm-transactions
