    using:
      foreign_key_constraint_on: occupancy_type_id
  - name: crm_property_type
    using:
      foreign_key_constraint_on: property_type_id
  - name: crm_roof_type
    using:
      foreign_key_constraint_on: roof_type_id
  - name: deal_harmony_property
    using:
      foreign_key_constraint_on:
        column: property_id
