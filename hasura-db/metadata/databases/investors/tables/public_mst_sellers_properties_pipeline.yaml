table:
  name: mst_sellers_properties_pipeline
  schema: public
object_relationships:
  - name: mst_properties_property_radar
    using:
      foreign_key_constraint_on: property_radar_id
  - name: mst_skip_tracing_batch_datum
    using:
      foreign_key_constraint_on: skip_tracing_id
array_relationships:
  - name: mst_sonar_campaign_sellers
    using:
      foreign_key_constraint_on:
        column: seller_id
        table:
          name: mst_sonar_campaign_sellers
          schema: public
