table:
  name: crm_sellers
  schema: public
object_relationships:
  - name: crm_lead
    using:
      foreign_key_constraint_on: lead_id
array_relationships:
  - name: crm_property_sellers
    using:
      foreign_key_constraint_on:
        column: seller_id
        table:
          name: crm_property_sellers
          schema: public
event_triggers:
  - name: on_crm_sellers_change
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: https://beacon-leads-ai-backend-663034886613.us-central1.run.app/api/webhooks/crm-sellers
