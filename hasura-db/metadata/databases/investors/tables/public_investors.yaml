table:
  name: investors
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: investor_advisor
array_relationships:
  - name: buyboxes
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: buyboxes
          schema: public
  - name: crm_property_investor_offers
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: crm_property_investor_offers
          schema: public
  - name: crm_transactions
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: crm_transactions
          schema: public
  - name: investor_emails
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: investor_emails
          schema: public
  - name: investor_phones
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: investor_phones
          schema: public
  - name: marketings
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: marketing
          schema: public
  - name: property_top_buyers
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: property_top_buyers
          schema: public
  - name: provider_hubspots
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: provider_hubspot
          schema: public
  - name: provider_smartleads
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: provider_smartleads
          schema: public
  - name: sync_records
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: sync_records
          schema: public
  - name: transactions
    using:
      foreign_key_constraint_on:
        column: investor_id
        table:
          name: transactions
          schema: public
event_triggers:
  - name: on_investors_change
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: https://beacon-leads-ai-backend-663034886613.us-central1.run.app/api/webhooks/investors
  - name: on_leads_change
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: https://beacon-leads-ai-backend-663034886613.us-central1.run.app/api/webhooks/leads
