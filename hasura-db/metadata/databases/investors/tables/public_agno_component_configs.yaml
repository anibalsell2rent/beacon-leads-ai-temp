table:
  name: agno_component_configs
  schema: public
object_relationships:
  - name: agno_component
    using:
      foreign_key_constraint_on: component_id
array_relationships:
  - name: agno_component_links
    using:
      manual_configuration:
        column_mapping:
          component_id: parent_component_id
          version: parent_version
        insertion_order: null
        remote_table:
          name: agno_component_links
          schema: public
