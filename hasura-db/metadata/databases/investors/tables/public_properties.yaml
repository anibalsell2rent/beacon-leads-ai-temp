table:
  name: properties
  schema: public
object_relationships:
  - name: condition_rating
    using:
      foreign_key_constraint_on: condition_rating_id
  - name: crm_ac_type
    using:
      foreign_key_constraint_on: ac_type_id
  - name: crm_foundation_type
    using:
      foreign_key_constraint_on: foundation_type_id
  - name: crm_heating_type
    using:
