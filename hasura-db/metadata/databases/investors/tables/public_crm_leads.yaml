table:
  name: crm_leads
  schema: public
object_relationships:
  - name: crmEmployeeByInvestorAdvisorId
    using:
      foreign_key_constraint_on: investor_advisor_id
  - name: crmEmployeeBySellerAdvisorId
    using:
      foreign_key_constraint_on: seller_advisor_id
  - name: crmEmployeeBySellerManagerId
    using:
      foreign_key_constraint_on: seller_manager_id
  - name: crmEmployeeByTransactionCoordinatorId
    using:
      foreign_key_constraint_on: transaction_coordinator_id
  - name: crmStageByStageId
    using:
      foreign_key_constraint_on: stage_id
  - name: crm_deal
    using:
      foreign_key_constraint_on:
        column: lead_id
        table:
          name: crm_deals
          schema: public
  - name: crm_employee
    using:
      foreign_key_constraint_on: cold_outreach_specialist_id
  - name: crm_seller
    using:
      foreign_key_constraint_on:
        column: lead_id
        table:
          name: crm_sellers
          schema: public
  - name: crm_stage
    using:
      foreign_key_constraint_on: previous_stage_id
  - name: property
    using:
      foreign_key_constraint_on: property_id
event_triggers:
  - name: on_crm_leads_change
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: https://beacon-leads-ai-backend-663034886613.us-central1.run.app/api/webhooks/crm-leads
